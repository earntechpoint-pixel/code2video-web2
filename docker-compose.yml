services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      CLIENT_ORIGIN: http://localhost:5173
      MAX_UPLOAD_MB: 5
      MAX_DURATION_SECONDS: 120
      MAX_WIDTH: 3840
      MAX_HEIGHT: 2160
      MAX_CONCURRENT_JOBS: 2
      WORKER_COUNT: 2
      JOB_TIMEOUT_MS: 900000
      FRAME_TIMEOUT_MS: 15000
      JOB_TTL_MS: 3600000
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 20
      TMP_ROOT: /app/tmp/jobs
    volumes:
      - code2video_jobs:/app/tmp/jobs
    mem_limit: 2g
    pids_limit: 512
    init: true
    security_opt:
      - seccomp=./seccomp_profile.json

volumes:
  code2video_jobs:
